<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyDeload - Ciclo & Lembretes</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3669/3669967.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --accent-blue: #2563eb;
            --accent-amber: #f59e0b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .trained-normal { background-color: var(--accent-blue) !important; color: white !important; }
        .trained-deload { background-color: var(--accent-amber) !important; color: white !important; }
        .today-mark { border: 2px solid var(--accent-blue); }

        .safe-area-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 80px); }
        
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #2563eb; }
    </style>
</head>
<body class="safe-area-bottom">

    <div id="tab-ciclo" class="tab-content active p-4 max-w-md mx-auto">
        <header class="py-6">
            <h1 class="text-2xl font-extrabold text-slate-900">Meu Ciclo</h1>
            <p id="cycle-subtitle" class="text-slate-500 text-sm">Carregando...</p>
        </header>

        <div id="status-card" class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-6 transition-all">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span id="week-tag" class="text-[10px] font-black uppercase tracking-widest px-2 py-1 rounded">Fase de Ganho</span>
                    <h2 id="week-title" class="text-4xl font-black mt-2 text-slate-800">Semana 1</h2>
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <svg id="status-icon" class="text-blue-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.
