<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyDeload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { color: #2563eb !important; }
    </style>
</head>
<body class="bg-slate-50 pb-24">

    <div id="tab-ciclo" class="tab-content active p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Meu Ciclo</h1>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <span id="week-tag" class="text-xs font-bold uppercase px-2 py-1 bg-blue-100 text-blue-700 rounded text-center inline-block mb-2">Carga</span>
            <h2 id="week-title" class="text-5xl font-black mb-4 text-slate-800">Semana 1</h2>
            
            <button onclick="nextWeek()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold active:scale-95 transition-transform mb-6">
                Próxima Semana
            </button>

            <div class="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden">
                <div class="p-4 border-b border-slate-200 bg-white">
                    <h3 class="font-bold text-slate-700 text-sm">Checklist de Hoje</h3>
                </div>
                <div id="days-list" class="divide-y divide-slate-100">
                    </div>
            </div>
        </div>
    </div>

    <div id="tab-historico" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Histórico</h1>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <p class="text-slate-500 text-center italic">Calendário em breve...</p>
        </div>
    </div>

    <div id="tab-ajustes" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Ajustes</h1>
        <div class="space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-100 flex items-center justify-between shadow-sm">
                <div>
                    <h4 class="font-bold text-sm">Semanas de Carga</h4>
                    <p class="text-[10px] text-slate-500 uppercase font-bold">Antes do Deload</p>
                </div>
                <select onchange="updateRatio(this.value)" id="ratio-select" class="bg-slate-50 border-none rounded-xl p-2 text-sm font-bold text-blue-600 outline-none">
                    <option value="2">2 semanas</option>
                    <option value="3">3 semanas</option>
                    <option value="4">4 semanas</option>
                    <option value="5">5 semanas</option>
                    <option value="6">6 semanas</option>
                    <option value="7">7 semanas</option>
                    <option value="8">8 semanas</option>
                </select>
            </div>

            <button onclick="resetApp()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100 active:scale-95 transition-transform">
                Resetar Ciclo Total
            </button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 h-20 flex justify-around items-center z-50">
        <button onclick="switchTab('ciclo')" id="nav-ciclo" class="nav-item active flex flex-col items-center gap-1 text-blue-600">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span class="text-[9px] font-bold uppercase">Ciclo</span>
        </button>
        <button onclick="switchTab('historico')" id="nav-historico" class="nav-item text-slate-400 flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="text-[9px] font-bold uppercase">Histórico</span>
        </button>
        <button onclick="switchTab('ajustes')" id="nav-ajustes" class="nav-item text-slate-400 flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="text-[9px] font-bold uppercase">Ajustes</span>
        </button>
    </nav>

    <script>
        // 1. ESTADO INICIAL
        let savedData = localStorage.getItem('mydeload_v2');
        let state = savedData ? JSON.parse(savedData) : {
            currentWeek: 1,
            deloadRatio: 4,
            history: {}
        };

        // 2. FUNÇÃO DE TROCA DE ABAS
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active', 'text-blue-600');
                n.classList.add('text-slate-400');
            });
            const selTab = document.getElementById('tab-' + tabId);
            const selNav = document.getElementById('nav-' + tabId);
            if (selTab && selNav) {
                selTab.classList.add('active');
                selNav.classList.add('active', 'text-blue-600');
                selNav.classList.remove('text-slate-400');
            }
        }

        // 3. AVANÇAR SEMANA
        function nextWeek() {
            state.currentWeek++;
            if (state.currentWeek > (state.deloadRatio + 1)) {
                state.currentWeek = 1;
            }
            save();
        }

        // 4. MUDAR PROPORÇÃO
        function updateRatio(val) {
            state.deloadRatio = parseInt(val);
            save();
        }

        // 5. MARCAR TREINO HOJE
        function toggleToday() {
            const now = new Date();
            const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
            if (!state.history) state.history = {};
            
            if (state.history[key]) {
                delete state.history[key];
            } else {
                state.history[key] = state.currentWeek;
            }
            save();
        }

        // 6. RESETAR
        function resetApp() {
            if(confirm("Deseja resetar todo o progresso?")) {
                state.currentWeek = 1;
                state.history = {};
                save();
            }
        }

        // 7. SALVAR E ATUALIZAR
        function save() {
            localStorage.setItem('mydeload_v2', JSON.stringify(state));
            render();
        }

        // 8. DESENHAR TELA
        function render() {
            const isDeload = state.currentWeek > state.deloadRatio;
            
            // Semana e Tag
            document.getElementById('week-title').innerText = "Semana " + state.currentWeek;
            const tag = document.getElementById('week-tag');
            tag.innerText = isDeload ? "Deload" : "Carga";
            tag.className = isDeload 
                ? "text-xs font-bold uppercase px-2 py-1 bg-amber-100 text-amber-700 rounded"
                : "text-xs font-bold uppercase px-2 py-1 bg-blue-100 text-blue-700 rounded";

            // Seletor
            document.getElementById('ratio-select').value = state.deloadRatio;

            // Checklist
            const list = document.getElementById('days-list');
            const days = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
            const now = new Date();
            const todayIdx = (now.getDay() + 6) % 7;
            const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
            const trained = state.history && state.history[key];

            list.innerHTML = '';
            days.forEach((day, i) => {
                const isToday = i === todayIdx;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-4 ${!isToday ? 'opacity-30' : ''}`;
                
                const colorClass = isDeload ? 'bg-amber-500 border-amber-500' : 'bg-blue-600 border-blue-600';
                
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <button onclick="${isToday ? 'toggleToday()' : ''}" 
                                class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all 
                                ${isToday && trained ? colorClass : 'border-slate-200'}">
                            ${isToday && trained ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><path d="M20 6 9 17l-5-5"/></svg>' : ''}
                        </button>
                        <span class="font-semibold text-sm ${isToday && trained ? 'text-slate-400 line-through' : 'text-slate-700'}">${day}</span>
                    </div>
                    ${isToday ? '<span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Hoje</span>' : ''}
                `;
                list.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
