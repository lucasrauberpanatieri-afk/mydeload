<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDeload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 pb-24">

    <div id="tab-ciclo" class="tab-content active p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black mb-2">Meu Ciclo</h1>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <span id="week-tag" class="text-xs font-bold uppercase p-1 bg-blue-100 text-blue-700 rounded">Carga</span>
            <h2 id="week-title" class="text-5xl font-black my-4">Semana 1</h2>
            <button onclick="nextWeek()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Próxima Semana</button>
        </div>
    </div>

    <div id="tab-historico" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black mb-4">Histórico</h1>
        <div id="calendar" class="bg-white p-4 rounded-3xl shadow-sm">
            <div id="month-display" class="text-center font-bold mb-4"></div>
            <div class="grid grid-cols-7 gap-2 text-center text-[10px] font-bold text-slate-400">
                <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-2 mt-2"></div>
        </div>
    </div>

    <div id="tab-ajustes" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black mb-4">Ajustes</h1>
        <button onclick="localStorage.clear(); location.reload();" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-bold">Limpar Tudo</button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t h-20 flex justify-around items-center z-50">
        <button onclick="switchTab('ciclo')" id="nav-ciclo" class="nav-item active text-xs">CICLO</button>
        <button onclick="switchTab('historico')" id="nav-historico" class="nav-item text-slate-400 text-xs">HISTÓRICO</button>
        <button onclick="switchTab('ajustes')" id="nav-ajustes" class="nav-item text-slate-400 text-xs">AJUSTES</button>
    </nav>

    <script>
        let state = JSON.parse(localStorage.getItem('mydeload_v2')) || { currentWeek: 1, history: {}, deloadRatio: 4 };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active', 'text-blue-600');
                n.classList.add('text-slate-400');
            });
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active', 'text-blue-600');
        }

        function nextWeek() {
            state.currentWeek = state.currentWeek >= (state.deloadRatio + 1) ? 1 : state.currentWeek + 1;
            save();
        }

        function save() {
            localStorage.setItem('mydeload_v2', JSON.stringify(state));
            render();
        }

        function render() {
            const isDeload = state.currentWeek > state.deloadRatio;
            document.getElementById('week-title').innerText = "Semana " + state.currentWeek;
            document.getElementById('week-tag').innerText = isDeload ? "Deload" : "Carga";
            document.getElementById('week-tag').className = isDeload ? "text-xs font-bold uppercase p-1 bg-amber-100 text-amber-700 rounded" : "text-xs font-bold uppercase p-1 bg-blue-100 text-blue-700 rounded";
            
            // Render simples do calendário
            const now = new Date();
            document.getElementById('month-display').innerText = now.toLocaleString('pt-br', {month: 'long', year: 'numeric'});
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';
            for(let d=1; d<=30; d++) {
                const div = document.createElement('div');
                div.className = "aspect-square flex items-center justify-center text-xs bg-slate-50 rounded-full";
                div.innerText = d;
                daysContainer.appendChild(div);
            }
        }

        render();
    </script>
</body>
</html>
