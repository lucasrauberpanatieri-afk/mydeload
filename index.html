<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyDeload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { color: #2563eb !important; }
    </style>
</head>
<body class="bg-slate-50 pb-24">

    <div id="tab-ciclo" class="tab-content active p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Meu Ciclo</h1>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <span id="week-tag" class="text-xs font-bold uppercase px-2 py-1 bg-blue-100 text-blue-700 rounded">Carga</span>
            <h2 id="week-title" class="text-5xl font-black my-4 text-slate-800">Semana 1</h2>
            <button onclick="nextWeek()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold active:scale-95 transition-transform">
                Próxima Semana
            </button>
        </div>
    </div>

    <div id="tab-historico" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Histórico</h1>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <p class="text-slate-500 text-center">Calendário em breve...</p>
        </div>
    </div>

    <div id="tab-ajustes" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Ajustes</h1>
        <div class="space-y-4">
            <button onclick="resetApp()" class="w-full py-4 bg-red-50 text-red-600 rounded-2xl font-bold border border-red-100">
                Limpar Tudo
            </button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 h-20 flex justify-around items-center z-50">
        <button onclick="switchTab('ciclo')" id="nav-ciclo" class="nav-item active flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold">CICLO</span>
        </button>
        <button onclick="switchTab('historico')" id="nav-historico" class="nav-item text-slate-400 flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold">HISTÓRICO</span>
        </button>
        <button onclick="switchTab('ajustes')" id="nav-ajustes" class="nav-item text-slate-400 flex flex-col items-center gap-1">
            <span class="text-[10px] font-bold">AJUSTES</span>
        </button>
    </nav>

    <script>
        // Estado inicial
        let state = {
            currentWeek: 1,
            deloadRatio: 4
        };

        // Função para trocar de abas
        function switchTab(tabId) {
            // Esconde todas as abas
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // Reseta cores dos botões
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.remove('active');
                n.classList.add('text-slate-400');
            });

            // Mostra a aba selecionada
            const selectedTab = document.getElementById('tab-' + tabId);
            const selectedNav = document.getElementById('nav-' + tabId);
            
            if (selectedTab && selectedNav) {
                selectedTab.classList.add('active');
                selectedNav.classList.add('active');
                selectedNav.classList.remove('text-slate-400');
            }
        }

        // Função para avançar semana
        function nextWeek() {
            state.currentWeek++;
            if (state.currentWeek > (state.deloadRatio + 1)) {
                state.currentWeek = 1;
            }
            updateUI();
        }

        // Função para resetar
        function resetApp() {
            if(confirm("Deseja resetar todos os dados?")) {
                state.currentWeek = 1;
                updateUI();
            }
        }

        // Atualiza a tela
        function updateUI() {
            const weekTitle = document.getElementById('week-title');
            const weekTag = document.getElementById('week-tag');
            
            if (weekTitle && weekTag) {
                weekTitle.innerText = "Semana " + state.currentWeek;
                const isDeload = state.currentWeek > state.deloadRatio;
                
                weekTag.innerText = isDeload ? "Deload" : "Carga";
                weekTag.className = isDeload 
                    ? "text-xs font-bold uppercase px-2 py-1 bg-amber-100 text-amber-700 rounded"
                    : "text-xs font-bold uppercase px-2 py-1 bg-blue-100 text-blue-700 rounded";
            }
        }

        // Inicia o app
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
